name: ci

# Pushes to master and pull requests only run the tests. Packaging (the
# build job) runs for a version tag, which also publishes the release, and
# when the workflow is started by hand (Actions -> ci -> Run workflow), e.g.
# to check a change to the Makefile or the package scripts before a release.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# The rootfs of the release the package is built for: the tests run in it,
# and the full bundle takes the dependency packages through its apk.
env:
  ROOTFS: releases/25.12.2/targets/x86/64/immortalwrt-25.12.2-x86-64-rootfs.tar.gz
  ROOTFS_SHA256: 29b6a86c9bc14a10dc1769f0c4afe33092ce669f667a5b7636d25271aff6a3cb
  # tried in order; the checksum makes a mirror as good as the original,
  # which can be very slow from here
  ROOTFS_MIRRORS: >-
    https://mirrors.cernet.edu.cn/immortalwrt
    https://mirror.nju.edu.cn/immortalwrt
    https://downloads.immortalwrt.org

jobs:
  # tests/ run in an OpenWrt rootfs (ucode + uci): an ImmortalWrt rootfs of
  # the same release as the SDK below, unpacked and entered with chroot. The
  # runner's own image provides Node.js for checkout and Python for check.py.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R: /tmp/rootfs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack the rootfs
        run: |
          ok=
          for m in $ROOTFS_MIRRORS; do
            echo "fetching from $m"
            # give up on a mirror that stalls instead of holding the job
            if curl -fsSL --retry 2 --connect-timeout 15 --speed-limit 20480 --speed-time 30 \
                --max-time 300 -o /tmp/rootfs.tar.gz "$m/$ROOTFS" &&
              echo "$ROOTFS_SHA256  /tmp/rootfs.tar.gz" | sha256sum -c -; then
              ok=1
              break
            fi
          done
          [ -n "$ok" ] || { echo "rootfs: no mirror delivered it" >&2; exit 1; }
          echo "MIRROR=$m" >> "$GITHUB_ENV"
          rm -rf "$R" && mkdir -p "$R"
          tar -xzf /tmp/rootfs.tar.gz -C "$R"
          # device nodes a booted system creates: the scripts redirect to
          # /dev/null, apk wants randomness
          for d in "null 3" "zero 5" "urandom 9"; do
            set -- $d
            [ -c "$R/dev/$1" ] || { rm -f "$R/dev/$1"; mknod -m 666 "$R/dev/$1" c 1 "$2"; }
          done
          mkdir -p "$R/src"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C "$R/src" -xf -

      # a dependency of the package that the image does not include; fetched
      # from the mirror that just delivered the rootfs
      - name: Install ucode-mod-socket
        run: |
          rm -f "$R/etc/resolv.conf" && cp /etc/resolv.conf "$R/etc/resolv.conf"
          grep -rl downloads.immortalwrt.org "$R/etc/apk" | xargs -r sed -i "s#https://downloads.immortalwrt.org#$MIRROR#g"
          chroot "$R" apk update || echo "apk update: some feeds failed"
          chroot "$R" apk add ucode-mod-socket

      - name: Generate configs for the fixtures
        run: chroot "$R" /bin/sh /src/tests/gen.sh /src /out

      - name: Run the helper scripts
        run: chroot "$R" /bin/sh /src/tests/scripts.sh /src /out

      # fw.sh gate/ungate, update.sh and the package's postrm, with stand-ins
      # for nft, ip, curl and unzip
      - name: Run the runtime scripts
        run: chroot "$R" /bin/sh /src/tests/runtime.sh /src /out

      # the package build minifies the pages (jsmin); what it misreads
      - name: Pages survive the minifier
        run: python3 tests/jslint.py .

      - name: Check the results
        run: |
          python3 -c 'import yaml' 2>/dev/null || {
            apt-get update -qq && apt-get install -y -qq python3-yaml >/dev/null
          }
          # --all: a part of the tests that left no output fails, not skipped
          python3 tests/check.py "$R/out" --all

      - name: Migration leaves the generated configs unchanged
        run: chroot "$R" /bin/sh /src/tests/migrate.sh /src

  build:
    needs: test
    # see the top: a version tag, or started by hand
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The official ImmortalWrt SDK image: the SDK is already unpacked in
    # /home/build/immortalwrt, so nothing has to be downloaded or installed.
    # Steps run as root (the runner's workspace is not writable for the
    # image's own "build" user); the SDK itself is driven as "build".
    container:
      image: immortalwrt/sdk:x86-64-openwrt-25.12.2
      options: --user root
    # packaging (fakeroot) has hung inside a runner container before: fail in
    # reasonable time instead of holding the runner
    timeout-minutes: 45
    env:
      SDK: /home/build/immortalwrt
    steps:
      # checkout and upload-artifact are JavaScript actions and the SDK image
      # has no Node.js
      - name: Install Node.js for the actions
        run: |
          curl -fsSL --retry 3 https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local
          node --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy the package into the SDK
        run: |
          rm -rf "$SDK/package/luci-app-xray-mosdns-x"
          mkdir -p "$SDK/package/luci-app-xray-mosdns-x"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=out -cf - . \
            | tar -C "$SDK/package/luci-app-xray-mosdns-x" -xf -
          chown -R build:build "$SDK/package/luci-app-xray-mosdns-x"

      - name: Prepare feeds
        run: |
          su build -s /bin/bash -c '
            set -e
            cd "$SDK"
            ./scripts/feeds update -a
            ./scripts/feeds install luci
            # the SDK ships without .config, which makes package/.../compile spawn menuconfig
            TERM=dumb make defconfig
          '

      - name: Build luci-app-xray-mosdns-x
        run: |
          su build -s /bin/bash -c '
            set -e
            cd "$SDK"
            TERM=dumb make package/luci-app-xray-mosdns-x/compile V=s -j"$(nproc)"
          '

      # What the package ships is minified: every page of it has to parse
      # (a misread regex cut adblock.js short in 1.0.0)
      - name: The minified pages parse
        run: |
          n=0
          for f in $(find "$SDK/build_dir" -path '*luci-app-xray-mosdns-x*' -path '*/www/luci-static/resources/*' -name '*.js'); do
            node -e "new Function(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" ||
              { echo "does not parse after minifying: $f" >&2; exit 1; }
            n=$((n + 1))
          done
          echo "$n minified pages parse"
          [ "$n" -gt 0 ]

      - name: Collect artifacts
        run: |
          mkdir -p out
          find "$SDK/bin" -name 'luci-app-xray-mosdns-x*' -exec cp -v {} out/ \;
          ls -la out/
          # an empty directory means the build produced nothing
          ls out/luci-app-xray-mosdns-x* >/dev/null

      # The full bundle (bundle/make.sh): the package, its dependencies from
      # the feeds of the release above, Xray, mosdns-x and the geo data, for
      # a router that cannot download them. The dependencies are fetched by
      # the rootfs's own apk (its keys check them); the SDK's apk writes the
      # index the router installs from.
      - name: Build the full bundle
        run: |
          B=/tmp/bundle-rootfs
          ok=
          for m in $ROOTFS_MIRRORS; do
            echo "fetching the rootfs from $m"
            if curl -fsSL --retry 2 --connect-timeout 15 --speed-limit 20480 --speed-time 30 \
                --max-time 300 -o /tmp/rootfs.tar.gz "$m/$ROOTFS" &&
              echo "$ROOTFS_SHA256  /tmp/rootfs.tar.gz" | sha256sum -c -; then
              ok=1
              break
            fi
          done
          [ -n "$ok" ] || { echo "rootfs: no mirror delivered it" >&2; exit 1; }
          rm -rf "$B" && mkdir -p "$B" && tar -xzf /tmp/rootfs.tar.gz -C "$B"
          for d in "null 3" "zero 5" "urandom 9"; do
            set -- $d
            [ -c "$B/dev/$1" ] || { rm -f "$B/dev/$1"; mknod -m 666 "$B/dev/$1" c 1 "$2"; }
          done
          rm -f "$B/etc/resolv.conf" && cp /etc/resolv.conf "$B/etc/resolv.conf"
          grep -rl downloads.immortalwrt.org "$B/etc/apk" | xargs -r sed -i "s#https://downloads.immortalwrt.org#$m#g"
          APK=$(find "$SDK/staging_dir/host/bin" "$SDK/staging_dir/hostpkg/bin" -name apk -type f 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "no apk in the SDK's host tools" >&2; exit 1; }
          sh bundle/make.sh "$(ls out/luci-app-xray-mosdns-x-*.apk | head -1)" "$B" "$APK" out
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-mosdns-x
          path: out/

      # Only for version tags: create the release for the tag and attach the
      # packages. The release text is the annotated tag's message; a tag with
      # a hyphen (v1.2.3-rc1) is published as a pre-release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          if [ "$TAG" != "v$VERSION" ] && [ "${TAG%%-*}" != "v$VERSION" ]; then
            echo "tag $TAG does not match PKG_VERSION $VERSION in the Makefile" >&2
            exit 1
          fi
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          ( cd out && sha256sum *.apk *.tar.gz > SHA256SUMS && cat SHA256SUMS )

          RELEASE_ID=$(TAG="$TAG" API="$API" python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          api, tag, token = os.environ["API"], os.environ["TAG"], os.environ["TOKEN"]

          def call(method, path, data=None):
              req = urllib.request.Request(api + path, method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": "token " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      return json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise SystemExit("%s %s -> HTTP %d: %s" % (method, path, e.code, e.read().decode()[:300]))

          # an annotated tag carries the release notes
          info = call("GET", "/tags/" + tag) or {}
          notes = (info.get("message") or "").strip()
          sums = open("out/SHA256SUMS").read().strip()
          body = (notes + "\n\n" if notes else "") + "```\n" + sums + "\n```\n"

          rel = call("GET", "/releases/tags/" + tag)
          if rel is None:
              rel = call("POST", "/releases", {
                  "tag_name": tag, "name": tag, "body": body,
                  "prerelease": "-" in tag, "draft": False,
              })
          else:
              # re-running the job for the same tag: replace the old files
              for a in rel.get("assets") or []:
                  call("DELETE", "/releases/%d/assets/%d" % (rel["id"], a["id"]))
          print(rel["id"])
          PY
          )
          echo "release id: $RELEASE_ID"
          for f in out/*.apk out/*.tar.gz out/SHA256SUMS; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$RELEASE_ID/assets?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
