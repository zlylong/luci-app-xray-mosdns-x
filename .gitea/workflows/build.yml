name: build-package

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git unzip wget curl rsync ca-certificates \
            python3 gawk gettext libncurses-dev zlib1g-dev file bc cpio \
            time zstd libssl-dev patch diffstat texinfo chrpath socat \
            python3-pexpect python3-jinja2 python3-git iputils-ping bzip2 gzip

      - name: Download ImmortalWrt 25.12.2 x86/64 SDK
        run: |
          URL=https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fsSL --retry 3 -o sdk.tar.zst "$URL"
          tar --zstd -xf sdk.tar.zst
          rm -f sdk.tar.zst

      - name: Build luci-app-xray-mosdns-x
        run: |
          SDK=$(ls -d immortalwrt-sdk-* | head -1)
          cp -r . "$SDK/package/luci-app-xray-mosdns-x"
          cd "$SDK"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # SDK ships without .config, which makes package/.../compile spawn menuconfig
          TERM=dumb make defconfig
          TERM=dumb make package/luci-app-xray-mosdns-x/compile V=s

      - name: Collect artifacts
        run: |
          SDK=$(ls -d immortalwrt-sdk-* | head -1)
          mkdir -p out
          find "$SDK/bin" -name 'luci-app-xray-mosdns-x*' -exec cp -v {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-mosdns-x
          path: out/
