name: build-package

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The official ImmortalWrt SDK image: the SDK is already unpacked in
    # /home/build/immortalwrt, so nothing has to be downloaded or installed.
    # Steps run as root (the runner's workspace is not writable for the
    # image's own "build" user); the SDK itself is driven as "build".
    container:
      image: immortalwrt/sdk:x86-64-openwrt-25.12.2
      options: --user root
    # packaging (fakeroot) has hung inside a runner container before: fail in
    # reasonable time instead of holding the runner
    timeout-minutes: 45
    env:
      SDK: /home/build/immortalwrt
    steps:
      # checkout and upload-artifact are JavaScript actions and the SDK image
      # has no Node.js
      - name: Install Node.js for the actions
        run: |
          curl -fsSL --retry 3 https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local
          node --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy the package into the SDK
        run: |
          rm -rf "$SDK/package/luci-app-xray-mosdns-x"
          mkdir -p "$SDK/package/luci-app-xray-mosdns-x"
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=out -cf - . \
            | tar -C "$SDK/package/luci-app-xray-mosdns-x" -xf -
          chown -R build:build "$SDK/package/luci-app-xray-mosdns-x"

      - name: Prepare feeds
        run: |
          su build -s /bin/bash -c '
            set -e
            cd "$SDK"
            ./scripts/feeds update -a
            ./scripts/feeds install luci
            # the SDK ships without .config, which makes package/.../compile spawn menuconfig
            TERM=dumb make defconfig
          '

      - name: Build luci-app-xray-mosdns-x
        run: |
          su build -s /bin/bash -c '
            set -e
            cd "$SDK"
            TERM=dumb make package/luci-app-xray-mosdns-x/compile V=s -j"$(nproc)"
          '

      - name: Collect artifacts
        run: |
          mkdir -p out
          find "$SDK/bin" -name 'luci-app-xray-mosdns-x*' -exec cp -v {} out/ \;
          find "$SDK/bin" -name 'luci-i18n-xray-mosdns-x*' -exec cp -v {} out/ \;
          ls -la out/
          # an empty directory means the build produced nothing
          ls out/luci-app-xray-mosdns-x* >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-mosdns-x
          path: out/
